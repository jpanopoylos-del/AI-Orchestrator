<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Button</title>
  <script>
    (function () {
      var root = document.documentElement;
      function readDark() {
        try { return localStorage.getItem('theme') === 'dark'; }
        catch (e) { return null; } /* storage unavailable */
      }
      if (readDark() === true) { root.setAttribute('data-theme', 'dark'); }
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) { return; }
        var dark = readDark();
        if (dark === null) { return; } /* keep the page's current theme */
        if (dark) { root.setAttribute('data-theme', 'dark'); }
        else { root.removeAttribute('data-theme'); }
        var box = document.getElementById('dark-mode');
        if (box) { box.checked = dark; }
      });
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f5;
      --fg: #222222;
      --btn-bg: #2563eb;
      --btn-fg: #ffffff;
      --btn-hover: #1d4ed8;
      --link: #1d4ed8;
      --focus: #1d4ed8;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #121212;
      --fg: #e5e5e5;
      --btn-bg: #60a5fa;
      --btn-fg: #0b1220;
      --btn-hover: #93c5fd;
      --link: #93c5fd;
      --focus: #fbbf24;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    a { color: var(--link); }
    a:focus-visible, input:focus-visible, button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
    }
    button:hover {
      background: var(--btn-hover);
    }
    #status {
      margin: 0;
    }
  </style>
</head>
<body>
  <button type="button" id="btn">Click me</button>
  <p id="status" aria-live="polite">Not clicked yet</p>
  <p><a href="settings.html">Settings</a></p>
  <script>
    (function () {
      var count = 0;
      var btn = document.getElementById('btn');
      var statusEl = document.getElementById('status');
      btn.addEventListener('click', function () {
        count += 1;
        statusEl.textContent = 'Clicked ' + count + (count === 1 ? ' time' : ' times');
      });
    })();
  </script>
</body>
</html>
