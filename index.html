<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Button</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }
    #status {
      margin: 0;
    }
  </style>
</head>
<body>
  <button type="button" id="btn">Click me</button>
  <p id="status" aria-live="polite">Not clicked yet</p>
  <script>
    (function () {
      var count = 0;
      var btn = document.getElementById('btn');
      var statusEl = document.getElementById('status');
      btn.addEventListener('click', function () {
        count += 1;
        statusEl.textContent = 'Clicked ' + count + (count === 1 ? ' time' : ' times');
      });
    })();
  </script>
</body>
</html>
