<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Button</title>
  <script>
    (function () {
      var root = document.documentElement;
      function readDark() {
        try { return localStorage.getItem('theme') === 'dark'; }
        catch (e) { return null; } /* storage unavailable */
      }
      if (readDark() === true) { root.setAttribute('data-theme', 'dark'); }
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) { return; }
        var dark = readDark();
        if (dark === null) { return; } /* keep the page's current theme */
        if (dark) { root.setAttribute('data-theme', 'dark'); }
        else { root.removeAttribute('data-theme'); }
        var box = document.getElementById('dark-mode');
        if (box) { box.checked = dark; }
      });
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f5;
      --fg: #222222;
      --btn-bg: #2563eb;
      --btn-fg: #ffffff;
      --btn-hover: #1d4ed8;
      --link: #1d4ed8;
      --focus: #1d4ed8;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #121212;
      --fg: #e5e5e5;
      --btn-bg: #60a5fa;
      --btn-fg: #0b1220;
      --btn-hover: #93c5fd;
      --link: #93c5fd;
      --focus: #fbbf24;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    a { color: var(--link); }
    a:focus-visible, input:focus-visible, button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
    }
    button:hover {
      background: var(--btn-hover);
    }
    #status {
      margin: 0;
    }
    /* Index-only: sky background (CSS only, no images). */
    :root {
      --sky-top: #3b82c4;
      --sky-bottom: #d6ecff;
      --panel-bg: rgba(255, 255, 255, 0.8);
    }
    [data-theme="dark"] {
      --sky-top: #0b1026;
      --sky-bottom: #1b2a4a;
      --panel-bg: rgba(18, 18, 18, 0.8);
    }
    /* The sky relies on <html> having no background: the body background
       propagates to the canvas, so a background on html would hide this
       z-index:-1 layer. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 12rem 3.5rem at 20% 22%, rgba(255, 255, 255, 0.9), transparent 70%),
        radial-gradient(ellipse 9rem 3rem at 28% 25%, rgba(255, 255, 255, 0.85), transparent 70%),
        radial-gradient(ellipse 14rem 4rem at 75% 38%, rgba(255, 255, 255, 0.9), transparent 70%),
        radial-gradient(ellipse 10rem 3rem at 68% 41%, rgba(255, 255, 255, 0.85), transparent 70%),
        radial-gradient(ellipse 11rem 3rem at 40% 78%, rgba(255, 255, 255, 0.9), transparent 70%),
        linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
      background-color: var(--bg);
    }
    [data-theme="dark"] body::before {
      background:
        radial-gradient(2.5px 2.5px at 8% 10%, #fff 60%, transparent),
        radial-gradient(2px 2px at 18% 22%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 30% 8%, #fff 60%, transparent),
        radial-gradient(2px 2px at 42% 14%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 55% 6%, #fff 60%, transparent),
        radial-gradient(2.5px 2.5px at 66% 18%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 78% 9%, #fff 60%, transparent),
        radial-gradient(2px 2px at 90% 14%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 96% 30%, #fff 60%, transparent),
        radial-gradient(2px 2px at 6% 38%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 15% 52%, #fff 60%, transparent),
        radial-gradient(2.5px 2.5px at 25% 44%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 84% 40%, #fff 60%, transparent),
        radial-gradient(2px 2px at 92% 56%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 74% 50%, #fff 60%, transparent),
        radial-gradient(2px 2px at 10% 68%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 22% 78%, #fff 60%, transparent),
        radial-gradient(2.5px 2.5px at 32% 90%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 44% 92%, #fff 60%, transparent),
        radial-gradient(2px 2px at 56% 88%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 66% 80%, #fff 60%, transparent),
        radial-gradient(2px 2px at 78% 72%, #fff 60%, transparent),
        radial-gradient(2.5px 2.5px at 88% 84%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 95% 92%, #fff 60%, transparent),
        radial-gradient(2px 2px at 4% 92%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 70% 95%, #fff 60%, transparent),
        radial-gradient(2px 2px at 50% 76%, #fff 60%, transparent),
        radial-gradient(1.5px 1.5px at 36% 66%, #fff 60%, transparent),
        linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
      background-color: var(--bg);
    }
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 2rem;
      border-radius: 12px;
      background: var(--panel-bg);
    }
    .panel p {
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="panel">
    <button type="button" id="btn">Click me</button>
    <p id="status" aria-live="polite">Not clicked yet</p>
    <p><a href="settings.html">Settings</a></p>
  </main>
  <script>
    (function () {
      var count = 0;
      var btn = document.getElementById('btn');
      var statusEl = document.getElementById('status');
      btn.addEventListener('click', function () {
        count += 1;
        statusEl.textContent = 'Clicked ' + count + (count === 1 ? ' time' : ' times');
      });
    })();
  </script>
</body>
</html>
